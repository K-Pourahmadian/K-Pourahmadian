name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"   # هر روز ساعت ۰۳:۰۰ UTC اجرا می‌شود
  workflow_dispatch:        # امکان اجرای دستی از تب Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&theme=transparent&hide_border=true&title_color=C9A227&icon_color=6E1423&text_color=EDE3D0&bg_color=00000000'
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: 'username=${{ github.repository_owner }}&layout=compact&theme=transparent&hide_border=true&title_color=C9A227&text_color=EDE3D0&bg_color=00000000'
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
