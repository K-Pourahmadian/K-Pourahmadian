<svg width="80" height="80" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <path id="orbit-path" d="M 8 50 A 42 16 0 1 1 92 50 A 42 16 0 1 1 8 50 Z" fill="none"/>
  </defs>

  <!-- orbit rings -->
  <g stroke="#C9A227" stroke-width="1.4" fill="none" opacity="0.55">
    <use href="#orbit-path" xlink:href="#orbit-path" transform="rotate(0 50 50)"/>
    <use href="#orbit-path" xlink:href="#orbit-path" transform="rotate(60 50 50)"/>
    <use href="#orbit-path" xlink:href="#orbit-path" transform="rotate(120 50 50)"/>
  </g>

  <!-- nucleus glow -->
  <circle cx="50" cy="50" r="9" fill="#C9A227" opacity="0.18">
    <animate attributeName="r" values="8;12;8" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.22;0.05;0.22" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- nucleus -->
  <circle cx="50" cy="50" r="6" fill="#C9A227"/>

  <!-- electron 1 -->
  <g transform="rotate(0 50 50)">
    <circle r="3" fill="#EDE3D0">
      <animateMotion dur="3s" repeatCount="indefinite">
        <mpath href="#orbit-path" xlink:href="#orbit-path"/>
      </animateMotion>
    </circle>
  </g>

  <!-- electron 2 -->
  <g transform="rotate(60 50 50)">
    <circle r="3" fill="#EDE3D0">
      <animateMotion dur="4s" repeatCount="indefinite">
        <mpath href="#orbit-path" xlink:href="#orbit-path"/>
      </animateMotion>
    </circle>
  </g>

  <!-- electron 3 -->
  <g transform="rotate(120 50 50)">
    <circle r="3" fill="#EDE3D0">
      <animateMotion dur="5s" repeatCount="indefinite">
        <mpath href="#orbit-path" xlink:href="#orbit-path"/>
      </animateMotion>
    </circle>
  </g>
</svg>
